<!DOCTYPE html>
<html lang="th" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - GameSpace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #121212; color: #e0e0e0; }</style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4" style="width: 400px; background-color: #1e1e1e; border-color: #333;">
        <h3 class="text-center text-primary mb-4">🎮 สร้างบัญชีผู้เล่น</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label text-light">Username</label>
                <input type="text" class="form-control bg-dark text-light" name="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-light">Password</label>
                <input type="password" class="form-control bg-dark text-light" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">สมัครสมาชิก</button>
        </form>
        <div class="text-center mt-2">
            <span class="text-muted">มีบัญชีอยู่แล้ว?</span> <a href="/login" class="text-info text-decoration-none">เข้าสู่ระบบ</a>
        </div>
    </div>
</body>
</html>
